<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page.bracketTitle">Tennis SCORE — Bracket</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/img/blta-logo-sm.png" alt="BLTA" class="brand-logo"><span class="brand-text"><span class="brand-tennis">LIGA</span><small>BLTA</small></span></a>
    <nav class="nav-links" id="nav-links">
      <span id="header-dynamic-items"></span>
      <a href="#" class="nav-my-profile-link" id="nav-my-profile-link" data-i18n="nav.myProfile">Môj profil</a>
    </nav>
    <div class="topbar-right">
      <div class="lang-switcher" id="lang-switcher">
        <button type="button" class="lang-btn" data-lang="sk"><img class="lang-flag" src="https://flagcdn.com/sk.svg" alt="">SK</button>
        <button type="button" class="lang-btn" data-lang="en"><img class="lang-flag" src="https://flagcdn.com/gb.svg" alt="">EN</button>
      </div>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
    </div>
  </div>
</div>

<div class="container">
  <h1 id="bracket-title" style="margin-top:22px;margin-bottom:32px">Loading…</h1>
  <div id="bracket-root">Loading…</div>
  <footer class="credit">BLTA - Bratislavská Liga Tenisových Amatérov · <button type="button" id="embed-bracket-btn" style="background:none;border:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0">Vložiť tento pavúk</button></footer>
</div>

<!-- Embed modal (same markup/ids as rankings.html/index.html — common.js's
     generic [data-close]/.modal-backdrop wiring handles closing it) -->
<div class="modal-backdrop" id="embed-modal" style="display:none">
  <div class="modal">
    <button type="button" class="close" data-close="embed-modal" aria-label="Close">&times;</button>
    <h3 data-i18n="embed.title">Vložiť do WordPress</h3>
    <p style="font-size:13px;color:var(--gray)" data-i18n="embed.desc">Vložte toto do bloku „Custom HTML" na vašej stránke blta.sk:</p>
    <div class="code-box" id="embed-code"></div>
    <div class="share-row">
      <button class="btn btn-outline btn-sm" id="copy-embed-btn" data-i18n="embed.copyCode">Kopírovať kód</button>
    </div>
  </div>
</div>

<script src="/js/localize.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script src="/js/bracket-view.js"></script>
<script src="/js/bracket.js"></script>
</body>
</html>
