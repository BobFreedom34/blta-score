<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLTA Score — Live Matches</title>
<meta name="description" content="Live scoring and match schedule for the BLTA amateur tennis league.">
<meta property="og:title" content="BLTA Score — Live Matches">
<meta property="og:description" content="Live scoring and match schedule for the BLTA amateur tennis league.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://score.blta.sk">
<meta property="og:image" content="https://score.blta.sk/img/blta-logo.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="BLTA Score — Live Matches">
<meta name="twitter:description" content="Live scoring and match schedule for the BLTA amateur tennis league.">
<link rel="icon" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/img/blta-logo.png" alt="BLTA" class="brand-logo"><small>SCORE</small></a>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="nav-links">
      <a href="/" class="active">Matches</a>
      <a href="/players">Players</a>
      <a href="/new-match">+ New match</a>
      <a href="#" class="player-login-link" id="player-login-link">LOG IN AS PLAYER</a>
    </nav>
  </div>
</div>

<div class="container">
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" class="tab" data-filter="ALL">All Matches <span class="count" id="count-ALL">0</span></button>
    <button type="button" class="tab" data-filter="SCHEDULED">Scheduled <span class="count" id="count-SCHEDULED">0</span></button>
    <button type="button" class="tab" data-filter="UNSCHEDULED">Planned <span class="count" id="count-UNSCHEDULED">0</span></button>
    <button type="button" class="tab tab-live" data-filter="LIVE"><span class="live-dot"></span>Live <span class="count" id="count-LIVE">0</span></button>
    <button type="button" class="tab" data-filter="FINISHED">Finished <span class="count" id="count-FINISHED">0</span></button>
  </div>

  <div class="filters">
    <input type="text" id="filter-q" placeholder="Search player name…">
    <select id="filter-category">
      <option value="">All categories</option>
      <option value="ELITE">BLTA ELITE</option>
      <option value="NEXT_GEN">BLTA NEXT GEN</option>
      <option value="NOVICE">BLTA NOVICE</option>
      <option value="FRIENDLY">FRIENDLY</option>
      <option value="VIP_CUP">VIP CUP</option>
    </select>
    <select id="filter-time">
      <option value="">Any time</option>
      <option value="today">Today</option>
      <option value="this_week">This week</option>
      <option value="next_week">Next week</option>
      <option value="tbd">No date (TBD)</option>
    </select>
    <button type="button" class="btn btn-outline" id="reset-filters-btn"><span style="color:var(--orange)">✕</span> Reset filters</button>
  </div>

  <div class="match-list" id="match-list">
    <div class="empty-state">Loading matches…</div>
  </div>

  <footer class="credit">BLTA Score · <button type="button" id="embed-list-btn" style="background:none;border:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0">Embed this list</button></footer>
</div>

<!-- Embed modal -->
<div class="modal-backdrop" id="embed-modal" style="display:none">
  <div class="modal">
    <button type="button" class="close" data-close="embed-modal" aria-label="Close">&times;</button>
    <h3>Embed on WordPress</h3>
    <p style="font-size:13px;color:var(--gray)" id="embed-modal-desc">Paste this into a "Custom HTML" block on your blta.sk page:</p>
    <div class="code-box" id="embed-code"></div>
    <div class="share-row">
      <button class="btn btn-outline btn-sm" id="copy-embed-btn">Copy code</button>
    </div>
  </div>
</div>

<!-- Quick schedule modal -->
<div class="modal-backdrop" id="quick-schedule-modal" style="display:none">
  <div class="modal">
    <button type="button" class="close" data-close="quick-schedule-modal" aria-label="Close">&times;</button>
    <h3>Set date &amp; location</h3>
    <form id="quick-schedule-form">
      <div class="field">
        <label for="quick-schedule-location">Place</label>
        <input type="text" id="quick-schedule-location" placeholder="e.g. NTC Bratislava, Court 3">
      </div>
      <div class="field">
        <label for="quick-schedule-date">Date &amp; time</label>
        <div style="display:flex;gap:8px">
          <input type="date" id="quick-schedule-date" style="flex:1">
          <input type="time" id="quick-schedule-time" style="flex:1">
        </div>
      </div>
      <div id="quick-schedule-error" style="color:var(--danger);font-weight:600;margin:8px 0"></div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px">Save</button>
    </form>
  </div>
</div>

<!-- Notify me modal -->
<div class="modal-backdrop" id="notify-modal" style="display:none">
  <div class="modal">
    <button type="button" class="close" data-close="notify-modal" aria-label="Close">&times;</button>
    <h3 id="notify-modal-title">Get notified</h3>
    <p style="font-size:13px;color:var(--gray)" id="notify-modal-desc"></p>
    <form id="notify-form">
      <div class="field">
        <label for="notify-email">Your email</label>
        <input type="email" id="notify-email" placeholder="you@example.com" required>
      </div>
      <div id="notify-error" style="color:var(--danger);font-weight:600;margin:8px 0"></div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px">Notify me</button>
    </form>
    <div style="text-align:center;color:var(--gray-dim);font-size:12px;font-weight:700;text-transform:uppercase;margin:16px 0">or</div>
    <button type="button" class="btn btn-outline btn-block" id="notify-push-btn">🔔 Push notification instead</button>
    <div id="notify-push-error" style="color:var(--danger);font-weight:600;margin:8px 0"></div>
  </div>
</div>

<!-- Log in as player modal -->
<div class="modal-backdrop" id="player-login-modal" style="display:none">
  <div class="modal">
    <button type="button" class="close" data-close="player-login-modal" aria-label="Close">&times;</button>
    <h3>Log in as player</h3>
    <p style="font-size:13px;color:var(--gray)">Enter the 4-digit code given to BLTA players.</p>
    <form id="player-login-form">
      <div class="otp-inputs">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="otp-digit" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="otp-digit" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="otp-digit" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="otp-digit" autocomplete="off">
      </div>
      <div id="player-login-error" style="color:var(--danger);font-weight:600;margin:8px 0;text-align:center"></div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>BLTA Score</span>
    <div style="display:flex;gap:12px">
      <a href="/badges-admin" class="footer-badges-link" style="display:none">Manage badges</a>
      <a href="/admin">Admin</a>
    </div>
  </div>
</footer>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
