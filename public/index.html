<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLTA Score — Live Matches</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/img/blta-logo.png" alt="BLTA" class="brand-logo"><small>SCORE</small></a>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="nav-links">
      <a href="/" class="active">Matches</a>
      <a href="/players">Players</a>
      <a href="/new-match">+ New match</a>
      <a href="/admin">Admin</a>
    </nav>
  </div>
</div>

<div class="container">
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" class="tab" data-status="PLANNED">Planned <span class="count" id="count-PLANNED">0</span></button>
    <button type="button" class="tab tab-live" data-status="LIVE"><span class="live-dot"></span>Live <span class="count" id="count-LIVE">0</span></button>
    <button type="button" class="tab" data-status="FINISHED">Finished <span class="count" id="count-FINISHED">0</span></button>
  </div>

  <div class="filters">
    <input type="text" id="filter-q" placeholder="Search player name…">
    <select id="filter-category">
      <option value="">All categories</option>
      <option value="ELITE">ELITE</option>
      <option value="NEXT_GEN">NEXT GEN</option>
      <option value="NOVICE">NOVICE</option>
      <option value="FRIENDLY">FRIENDLY</option>
    </select>
    <select id="filter-time">
      <option value="">Any time</option>
      <option value="this_week">This week</option>
      <option value="next_week">Next week</option>
      <option value="tbd">No date (TBD)</option>
    </select>
  </div>

  <div class="match-list" id="match-list">
    <div class="empty-state">Loading matches…</div>
  </div>

  <footer class="credit">BLTA Score · <button type="button" id="embed-list-btn" style="background:none;border:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0">Embed this list</button></footer>
</div>

<!-- Embed modal -->
<div class="modal-backdrop" id="embed-modal" style="display:none">
  <div class="modal">
    <button type="button" class="close" data-close="embed-modal" aria-label="Close">&times;</button>
    <h3>Embed on WordPress</h3>
    <p style="font-size:13px;color:var(--gray)" id="embed-modal-desc">Paste this into a "Custom HTML" block on your blta.sk page:</p>
    <div class="code-box" id="embed-code"></div>
    <div class="share-row">
      <button class="btn btn-outline btn-sm" id="copy-embed-btn">Copy code</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
