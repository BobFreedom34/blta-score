<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLTA Score — Rankings</title>
<meta name="description" content="BLTA league point standings — overall, per-category Race points, and tournament points.">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/img/blta-logo.png" alt="BLTA" class="brand-logo"><small>SCORE</small></a>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="nav-links">
      <a href="/">Matches</a>
      <a href="/players">Players</a>
      <a href="/rankings" class="active">Rankings</a>
      <a href="/new-match">+ New match</a>
      <a href="#" class="player-login-link" id="player-login-link">LOG IN AS PLAYER</a>
    </nav>
  </div>
</div>

<div class="container">
  <h1 style="margin-top:22px">Rankings</h1>
  <p style="color:var(--gray-dim)" id="rankings-updated">Loading…</p>

  <div class="tabs" id="rankings-tabs" role="tablist"></div>

  <div class="card card-dark">
    <div id="rankings-list">Loading…</div>
  </div>
</div>

<!-- Log in as player modal -->
<div class="modal-backdrop" id="player-login-modal" style="display:none">
  <div class="modal">
    <button type="button" class="close" data-close="player-login-modal" aria-label="Close">&times;</button>
    <h3>Log in as player</h3>
    <p style="font-size:13px;color:var(--gray)">Enter the 4-digit code given to BLTA players. Don't have one? Log in with <strong>3344</strong> instead — you can still create and manage your own matches.</p>
    <form id="player-login-form">
      <div class="otp-inputs">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="otp-digit" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="otp-digit" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="otp-digit" autocomplete="off">
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="otp-digit" autocomplete="off">
      </div>
      <div id="player-login-error" style="color:var(--danger);font-weight:600;margin:8px 0;text-align:center"></div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>BLTA Score</span>
    <div style="display:flex;gap:12px">
      <a href="/badges-admin" class="footer-badges-link" style="display:none">Manage badges</a>
      <a href="/admin">Admin</a>
    </div>
  </div>
</footer>

<script src="/js/common.js"></script>
<script src="/js/rankings.js"></script>
</body>
</html>
