<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLTA Score — Player</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/img/blta-logo.png" alt="BLTA" class="brand-logo"><small>SCORE</small></a>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="nav-links">
      <a href="/">Matches</a>
      <a href="/players">Players</a>
      <a href="/new-match">+ New match</a>
      <a href="#" class="player-login-link" id="player-login-link">LOG IN AS PLAYER</a>
    </nav>
  </div>
</div>

<div class="container">
  <h1 style="margin-top:22px" id="player-name">Loading…</h1>

  <div class="info-grid" id="player-stats">
    <div class="info-item">
      <div class="label">Games played</div>
      <div class="value" id="stat-played" style="font-size:22px">0</div>
    </div>
    <div class="info-item">
      <div class="label">Wins — Losses</div>
      <div class="value" id="stat-wl" style="font-size:22px">0 — 0</div>
    </div>
    <div class="info-item">
      <div class="label">Win rate</div>
      <div class="value" id="stat-pct" style="font-size:22px">—</div>
    </div>
  </div>

  <div id="h2h-section"></div>

  <div class="filters">
    <select id="result-filter">
      <option value="">All results</option>
      <option value="won">Won</option>
      <option value="lost">Lost</option>
    </select>
    <select id="year-filter">
      <option value="">All years</option>
    </select>
    <button type="button" class="btn btn-outline" id="reset-filters-btn"><span style="color:var(--orange)">✕</span> Reset filters</button>
  </div>

  <div class="match-list" id="player-match-list"></div>
</div>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>BLTA Score</span>
    <a href="/admin">Admin</a>
  </div>
</footer>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/player.js"></script>
</body>
</html>
