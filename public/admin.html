<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tennis SCORE — Backend</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/img/blta-logo.png" alt="BLTA" class="brand-logo"><span class="brand-text"><span class="brand-tennis">TENNIS</span><small>SCORE</small></span></a>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="nav-links">
      <span id="header-dynamic-items"></span>
    </nav>
  </div>
</div>

<div class="container">
  <h1 style="margin-top:22px">Backend</h1>
  <!-- Section nav for the whole admin backend — reuses the site's existing
       .tabs/.tab pill component (same one the matches/player-stats tabs
       use) rather than a new sidebar pattern, so it's already responsive
       and visually consistent. Hidden until common.js's admin check
       confirms this visitor is actually an admin (same reveal-on-admin
       pattern the old scattered footer links used) — a logged-out visitor
       just sees the login form below, nothing else. -->
  <div class="tabs admin-tabs" style="display:none">
    <a href="/admin" class="tab active">Overview</a>
    <a href="/header-admin" class="tab">Menu</a>
    <a href="/badges-admin" class="tab">Badges</a>
    <a href="/players" class="tab">Players</a>
    <a href="/login-history" class="tab">Login History</a>
  </div>
  <div id="admin-root" class="card" style="max-width:420px">Loading…</div>
</div>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>BLTA Score</span>
    <div style="display:flex;gap:12px">
      <a href="/admin">Admin</a>
    </div>
  </div>
</footer>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
