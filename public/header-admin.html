<!DOCTYPE html>
<html lang="en">
<head>

<link rel="manifest" href="/manifest.json">

<div class="topbar">

  <div id="header-admin-root">Loading…</div>

    <span>BLTA Score</span>
    <div style="display:flex;gap:12px">
      <a href="/admin">Admin</a>
    </div>
