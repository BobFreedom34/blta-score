<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLTA Score — New Match</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="dot"></span>BLTA <small>Live Score</small></div>
    <nav class="nav-links">
      <a href="/">Matches</a>
      <a href="/players">Players</a>
      <a href="/new-match" class="active">+ New match</a>
    </nav>
  </div>
</div>

<div class="container" style="max-width:640px">
  <h1 style="margin-top:22px">Plan a new match</h1>
  <p style="color:var(--gray)">Pick two players (type a new name to add them), a category, and how the match will be played.</p>

  <form id="new-match-form" class="card">

    <div class="grid-2">
      <div class="field">
        <label for="player1">Player 1</label>
        <input list="players-datalist" id="player1" name="player1" placeholder="Type a name…" required autocomplete="off">
      </div>
      <div class="field">
        <label for="player2">Player 2</label>
        <input list="players-datalist" id="player2" name="player2" placeholder="Type a name…" required autocomplete="off">
      </div>
    </div>
    <datalist id="players-datalist"></datalist>

    <div class="field">
      <label for="category">Category</label>
      <select id="category" required>
        <option value="ELITE">Elite</option>
        <option value="NEXT_GEN">Next Gen</option>
        <option value="NOVICE">Novice</option>
      </select>
    </div>

    <div class="grid-2">
      <div class="field">
        <label for="location">Place</label>
        <input type="text" id="location" placeholder="e.g. NTC Bratislava, Court 3">
      </div>
      <div class="field">
        <label for="scheduledAt">Date &amp; time</label>
        <input type="datetime-local" id="scheduledAt">
      </div>
    </div>

    <div class="field">
      <label>Match format</label>
      <div class="format-options" id="format-options"></div>
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px">Create match</button>
    <div id="form-error" style="color:var(--danger);font-weight:600;margin-top:10px"></div>
  </form>
</div>

<script src="/js/common.js"></script>
<script src="/js/new-match.js"></script>
</body>
</html>
