<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLTA Score — New Match</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/img/blta-logo.png" alt="BLTA" class="brand-logo"><small>SCORE</small></a>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="nav-links">
      <a href="/">Matches</a>
      <a href="/players">Players</a>
      <a href="/new-match" class="active">+ New match</a>
    </nav>
  </div>
</div>

<div class="container" style="max-width:640px">
  <h1 style="margin-top:22px">Plan a new match</h1>
  <p style="color:var(--gray)">Pick two players (type a new name to add them), a category, and how the match will be played.</p>

  <form id="new-match-form" class="card">

    <div class="grid-2">
      <div class="field">
        <label for="player1">Player 1</label>
        <div class="autocomplete">
          <input id="player1" name="player1" placeholder="Type a name…" required autocomplete="off">
          <div class="autocomplete-list" id="player1-suggestions"></div>
        </div>
      </div>
      <div class="field">
        <label for="player2">Player 2</label>
        <div class="autocomplete">
          <input id="player2" name="player2" placeholder="Type a name…" required autocomplete="off">
          <div class="autocomplete-list" id="player2-suggestions"></div>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="category">Category</label>
      <select id="category" required>
        <option value="ELITE">ELITE</option>
        <option value="NEXT_GEN">NEXT GEN</option>
        <option value="NOVICE">NOVICE</option>
        <option value="FRIENDLY">FRIENDLY</option>
      </select>
    </div>

    <div class="grid-2">
      <div class="field">
        <label for="location">Place</label>
        <input type="text" id="location" placeholder="e.g. NTC Bratislava, Court 3">
      </div>
      <div class="field">
        <label for="scheduledAtDate">Date &amp; time</label>
        <div style="display:flex;gap:8px">
          <input type="date" id="scheduledAtDate" style="flex:1">
          <input type="time" id="scheduledAtTime" style="flex:1">
        </div>
        <small>Optional — leave blank if it's not scheduled yet, and set it later from the match page.</small>
      </div>
    </div>

    <div class="field">
      <label for="notes">Additional info</label>
      <textarea id="notes" rows="3" maxlength="1000" placeholder="e.g. round of 16, bring your own balls, meet 10 min early…"></textarea>
      <small>Optional — shown on the match page.</small>
    </div>

    <div class="field">
      <label>Match format</label>
      <div class="format-options" id="format-options"></div>
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px">Create match</button>
    <div id="form-error" style="color:var(--danger);font-weight:600;margin-top:10px"></div>
  </form>
</div>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>BLTA Score</span>
    <a href="/admin">Admin</a>
  </div>
</footer>

<script src="/js/common.js"></script>
<script src="/js/new-match.js"></script>
</body>
</html>
