services:
  - type: web
    name: blta-score
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: blta-score-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_URL
        value: https://score.blta.sk
      - key: SMTP_HOST
        value: smtp.m1.websupport.sk
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL
        value: robert.sloboda@gmail.com
      - key: MAIL_FROM
        value: "BLTA Score <score@blta.sk>"
      - key: ADMIN_PASSWORD
        sync: false
      - key: PLAYER_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
